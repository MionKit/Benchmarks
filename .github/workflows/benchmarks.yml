name: Node benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: run benchmarks
      # mionupdate fetches the latest published @mionjs/* and installs it.
      # See .github/workflows/ci.yml for the rationale.
      run: |
        pnpm mionupdate
        pnpm start y 100 10 40

    - name: compare results
      run: |
        node ./benchmark compare -t
        node ./benchmark compare -u

    - name: commit and push updated results
      uses: github-actions-x/commit@v2.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-branch: 'master'
        commit-message: 'chore: update benchmark results'
        force-add: 'true'
        files: benchmark-results.json README.md
        name: Github Actions
        email: <>
